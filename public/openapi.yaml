openapi: 3.1.0
info:
  title: RINGFALL CHAOS CIRCUIT Public API
  version: 1.0.0
  description: Cloudflare-hosted game health and discovery APIs, scoped private-room hosting, and protected map publication. Private-room invitations are limited to a single seat and do not expose the platform key.
servers:
  - url: https://frwf.ja1.io
paths:
  /api/health:
    get:
      summary: Live public-safe Cloudflare Worker health checks
      responses:
        '200':
          description: Health payload
          content:
            application/json:
              schema:
                type: object
  /api/v1/health:
    get:
      summary: Versioned health declaration
      responses:
        '200':
          description: Health payload
  /api/docs:
    get:
      summary: Route and capability documentation
      responses:
        '200':
          description: Documentation payload
