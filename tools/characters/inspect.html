<!doctype html><html><head><title>FRWF character inspection</title><style>body{margin:0;background:#131c28}canvas{display:block}</style></head><body><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color('#172131');const c=new T.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);c.position.set(2,1.3,3.5);c.lookAt(0,.95,0);s.add(new T.HemisphereLight('#ffffff','#263c50',2));const l=new T.DirectionalLight('#ffffff',3);l.position.set(3,5,5);s.add(l);
const a=await fetch('/characters/manifest.json').then(r=>r.json());const g=await new GLTFLoader().loadAsync(a.fighters[0].url);s.add(g.scene);r.setAnimationLoop(()=>r.render(s,c));
</script></body></html>
